<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rayu 的个人每日日记">
  <title>Rayu 的日记</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="now-playing" aria-label="氛围曲目展示，无音频播放"><span aria-hidden="true">♪</span> night fishing · quiet radio <small>静默电台</small></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header">
        <h1 class="site-title">Rayu 的日记</h1>
        <p class="site-subtitle" id="today-line">—</p>
        <input type="search" id="search" class="search" placeholder="搜索日记…" autocomplete="off">
      </header>
      <nav class="day-list" id="day-list" aria-label="日记列表"></nav>
      <footer class="sidebar-footer">
        <span id="day-count">共 0 篇</span>
      </footer>
    </aside>

    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="打开目录">☰</button>
    <div class="scrim" id="scrim" hidden></div>

    <main class="content" id="content">
      <section class="landscape" aria-label="月下群山与乘扫帚的小巫师">
        <pre id="ascii-landscape" aria-hidden="true"></pre>
        <div class="pixel-wizard" aria-hidden="true"><i></i></div>
        <div class="scene-caption">夜色很慢，日子一页一页翻<span> / AFTER HOURS</span></div>
      </section>
      <article class="entry" id="entry">
        <div class="entry-empty">加载中…</div>
      </article>
    </main>
  </div>

  <script src="assets/markdown.js" defer></script>
  <script src="assets/scene.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
